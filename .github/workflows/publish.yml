# Publishes @funnelchat-hq/sandbox to npm when a version tag (vX.Y.Z) is pushed, through npm Trusted
# Publishing: npm accepts the publish only from this repo and this workflow, by OIDC, with no token,
# and adds provenance on its own.
#
# Only a tag whose commit is on main is published, and only after the checks and the tests pass. A pre-release
# (vX.Y.Z-rc.N, vX.Y.Z-beta.N) goes out under the `next` dist-tag, never as `latest`.
#
# ONE-TIME SETUP: on npmjs.com, in the package settings, add a Trusted Publisher for GitHub Actions
# with organization Funnelchat20, repository funnelchat-sandbox, workflow publish.yml and no environment.
#
# Run it by hand (workflow_dispatch) to check the OIDC exchange with npm without publishing anything.
name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One run per tag at a time; a second run for the same tag waits and then finds the version published.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The whole history, to know whether the tag's commit is on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 20, as in engines (>=20.11) and the Dockerfile. The latest 20.x also meets npm 11 (^20.17.0).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # npm 11.5.1 or newer does the OIDC exchange. Not latest: npm 12 asks for newer Node versions.
      - run: npm install -g npm@^11.5.1

      - name: Check the trusted publishing exchange
        if: github.event_name == 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"
          id_token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')"
          if [ -z "$id_token" ]; then
            echo "::error::Could not get the GitHub identity token"
            exit 1
          fi
          echo "::add-mask::$id_token"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name//\//%2f}")"
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::Trusted publishing exchange for $name answered HTTP $status"
            exit 1
          fi
          echo "Trusted publishing OK for $name"

      - name: Check that the tag's commit is on main
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main: only a commit of main is published"
            exit 1
          fi

      - name: Check that the tag matches package.json
        if: github.event_name != 'workflow_dispatch'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check whether the version is already published
        id: published
        if: github.event_name != 'workflow_dispatch'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'

      - name: Test before publishing
        if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        run: |
          npm run generate:check
          npm run typecheck
          npm run lint
          npm test

      # prepack builds dist/. A pre-release (1.2.3-rc.1, 1.2.3-beta.2) goes out under `next`, never as `latest`.
      - name: Publish
        if: github.event_name != 'workflow_dispatch' && steps.published.outputs.already != 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish --provenance --access public --tag "$dist_tag"
